<!doctype html>
<html style="height: 100%; margin: 0;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editorial Aesthetic Theme Reference</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
      body { margin: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
      .h-full { height: 100%; }
      .w-full { width: 100%; }
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .flex-1 { flex: 1 1 0%; }
    </style>
  </head>
  <body>
    <div class="w-[1024px] h-[768px] bg-[#121212] overflow-hidden relative flex flex-col font-sans text-[#DED8C4]" style="background-color: #121212;">
      <div class="absolute inset-0 z-0" style="background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #121212 70%);"></div>
      <div class="absolute w-full h-[120%] -top-[10%] left-0 z-10 opacity-20" style="background-image: linear-gradient(#333 1px, transparent 1px), linear-gradient(90deg, #333 1px, transparent 1px); background-size: 60px 60px; transform: perspective(500px) rotateX(60deg);"></div>
      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] border border-[#333] rounded-full z-0 opacity-40"></div>
      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] border border-[#333] rounded-full z-0 opacity-40"></div>
      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[200px] h-[200px] border border-[#333] rounded-full z-0 opacity-40"></div>

      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-[#BE2E21] rounded-full flex items-center justify-center z-20 shadow-[0_0_80px_rgba(190,46,33,0.4)] border-4 border-[#121212]">
        <div class="text-center">
          <div class="text-4xl font-black tracking-tighter leading-none">Y.V.</div>
          <div class="text-[10px] uppercase font-bold tracking-[0.2em] mt-1">Personal Core</div>
        </div>
      </div>

      <div class="absolute top-[180px] left-[580px] z-30 group">
        <div class="w-12 h-12 bg-[#DED8C4] rounded-sm transform rotate-45 flex items-center justify-center">
          <div class="-rotate-45 text-[#121212] font-black text-xl">01</div>
        </div>
        <div class="absolute left-16 top-1/2 -translate-y-1/2 whitespace-nowrap">
          <div class="text-[#BE2E21] text-[10px] font-black uppercase tracking-widest">Module Alpha</div>
          <div class="text-2xl font-black italic uppercase -mt-1">Portfolio</div>
        </div>
      </div>

      <div class="absolute top-[520px] left-[320px] z-30">
        <div class="w-10 h-10 border-2 border-[#BE2E21] rounded-full flex items-center justify-center">
          <div class="w-4 h-4 bg-[#BE2E21] rounded-full"></div>
        </div>
        <div class="absolute left-14 top-1/2 -translate-y-1/2 whitespace-nowrap">
          <div class="text-[#BE2E21] text-[10px] font-black uppercase tracking-widest">Module Beta</div>
          <div class="text-2xl font-black italic uppercase -mt-1">Experience</div>
        </div>
      </div>

      <div class="absolute top-[340px] left-[180px] z-30">
        <div class="w-8 h-8 bg-transparent border-2 border-[#DED8C4] transform skew-x-12 flex items-center justify-center">
          <div class="text-[10px] font-black">IV</div>
        </div>
        <div class="absolute right-12 top-1/2 -translate-y-1/2 whitespace-nowrap text-right">
          <div class="text-[#BE2E21] text-[10px] font-black uppercase tracking-widest">Signal Relay</div>
          <div class="text-2xl font-black italic uppercase -mt-1">Contact</div>
        </div>
      </div>

      <header class="relative z-40 p-12 flex justify-between items-start">
        <div class="flex flex-col">
          <h1 class="text-7xl font-black tracking-tighter leading-[0.8] mb-2 uppercase">Yuri<br/>Volkov</h1>
          <div class="w-24 h-2 bg-[#BE2E21] mt-4"></div>
          <p class="mt-6 max-w-xs text-xs uppercase tracking-widest font-bold opacity-60 leading-relaxed">Visual Engineer &amp; Spatial Designer<br/>Based in Section 04 / Moscow Grid</p>
        </div>
        <div class="text-right">
          <div class="text-[10px] uppercase font-bold tracking-[0.3em] mb-4">Archive Ref. 2024-C</div>
          <nav class="flex flex-col gap-2 items-end">
            <div class="px-3 py-1 bg-[#DED8C4] text-[#121212] font-black text-xs uppercase cursor-pointer">Access Data</div>
            <div class="px-3 py-1 border border-[#DED8C4] text-[#DED8C4] font-black text-xs uppercase cursor-pointer">Network</div>
          </nav>
        </div>
      </header>

      <aside class="absolute left-12 bottom-12 z-40">
        <div class="text-[10px] uppercase font-bold tracking-widest flex items-center gap-4 text-[#BE2E21]">
          <span class="w-2 h-2 bg-[#BE2E21] rounded-full animate-pulse"></span> System Active: 100% Stability
        </div>
      </aside>

      <footer class="absolute right-12 bottom-12 z-40 flex gap-12 items-end">
        <div class="flex flex-col items-end">
          <div class="text-4xl font-black italic leading-none">19.04</div>
          <div class="text-[10px] uppercase font-bold tracking-widest opacity-40">Timestamp</div>
        </div>
        <div class="w-[1px] h-12 bg-[#333]"></div>
        <div class="flex flex-col items-end">
          <div class="text-4xl font-black leading-none uppercase">CCCP</div>
          <div class="text-[10px] uppercase font-bold tracking-widest opacity-40">Creative Collective</div>
        </div>
      </footer>

      <div class="absolute top-0 right-[25%] h-full w-[1px] bg-[#333] opacity-20 z-10"></div>
      <div class="absolute top-0 left-[25%] h-full w-[1px] bg-[#333] opacity-20 z-10"></div>
      <div class="absolute top-1/2 left-0 w-full h-[1px] bg-[#333] opacity-20 z-10"></div>
    </div>
  </body>
</html>
