name: Deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://twctoolbox.com

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run lint

      - name: Build site
        run: bun run build

      - name: Add release metadata
        run: printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/release.json

      - name: Prepare SSH client
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/portfolio-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/portfolio-ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/portfolio-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/portfolio-ssh/deploy_key" "$RUNNER_TEMP/portfolio-ssh/known_hosts"

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/portfolio-ssh/deploy_key"
          known_hosts="$RUNNER_TEMP/portfolio-ssh/known_hosts"
          destination="$DEPLOY_USER@$DEPLOY_HOST"
          ssh_command="ssh -i $key -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts -o StrictHostKeyChecking=yes -p $DEPLOY_PORT"

          $ssh_command "$destination" "mkdir -p /srv/twctoolbox/releases/$GITHUB_SHA"
          rsync -az --delete --chmod=D755,F644 -e "$ssh_command" \
            dist/ "$destination:/srv/twctoolbox/releases/$GITHUB_SHA/"

      - name: Activate release
        id: activate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/portfolio-ssh/deploy_key"
          known_hosts="$RUNNER_TEMP/portfolio-ssh/known_hosts"

          ssh \
            -i "$key" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s -- "$GITHUB_SHA" <<'REMOTE'
          set -euo pipefail
          release_sha="$1"
          base=/srv/twctoolbox
          release="$base/releases/$release_sha"

          case "$release_sha" in
            ''|*[!0-9a-f]*) exit 2 ;;
          esac

          test -s "$release/index.html"
          test -s "$release/release.json"
          readlink -f "$base/current" > "$base/.previous" || true
          ln -sfn "releases/$release_sha" "$base/current"
          REMOTE

      - name: Verify public release
        run: |
          set -euo pipefail
          expected="{\"commit\":\"$GITHUB_SHA\"}"

          main_release="$(curl -fsS --retry 5 --retry-delay 2 --connect-timeout 10 \
            "https://twctoolbox.com/release.json?deploy=$GITHUB_SHA")"
          node_release="$(curl -fsS --retry 5 --retry-delay 2 --connect-timeout 10 \
            "https://node.twctoolbox.com/release.json?deploy=$GITHUB_SHA")"

          test "$main_release" = "$expected"
          test "$node_release" = "$expected"

      - name: Roll back failed release
        if: ${{ failure() && steps.activate.outcome == 'success' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          key="$RUNNER_TEMP/portfolio-ssh/deploy_key"
          known_hosts="$RUNNER_TEMP/portfolio-ssh/known_hosts"

          ssh \
            -i "$key" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s <<'REMOTE'
          set -euo pipefail
          base=/srv/twctoolbox
          previous="$(cat "$base/.previous")"

          case "$previous" in
            "$base"/releases/[0-9a-f]*) ;;
            *) exit 2 ;;
          esac

          test -s "$previous/index.html"
          ln -sfn "releases/$(basename "$previous")" "$base/current"
          REMOTE

      - name: Remove superseded releases
        if: ${{ success() }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          key="$RUNNER_TEMP/portfolio-ssh/deploy_key"
          known_hosts="$RUNNER_TEMP/portfolio-ssh/known_hosts"

          ssh \
            -i "$key" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$known_hosts" \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            bash -s <<'REMOTE'
          set -euo pipefail
          base=/srv/twctoolbox
          current="$(readlink -f "$base/current")"
          mapfile -t releases < <(
            find "$base/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -rn \
              | cut -d' ' -f2-
          )

          for ((index = 5; index < ${#releases[@]}; index += 1)); do
            candidate="${releases[$index]}"
            case "$candidate" in
              "$base"/releases/[0-9a-f]*) ;;
              *) continue ;;
            esac
            if [ "$(readlink -f "$candidate")" != "$current" ]; then
              rm -rf -- "$candidate"
            fi
          done
          REMOTE
